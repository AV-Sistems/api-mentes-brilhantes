services:
  db:
    image: postgres:16
    container_name: mentes-brilhantes-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: db_mentes_brilhantes
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d db_mentes_brilhantes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

