# Configurações do Banco de Dados (PostgreSQL)
# O formato ${ENV_VAR:default_value} diz ao Quarkus: 
# "Use a variável de ambiente, se não existir, use o valor após os dois pontos".

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_mentes_brilhantes}

# Configurações do Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration


#Banco para testes
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

