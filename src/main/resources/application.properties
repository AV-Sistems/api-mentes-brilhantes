# =========================
# BANCO DE DADOS (PERSISTENTE)
# =========================
# Esta configura��o usa um PostgreSQL fixo e persistente.
# O banco em si pode ser criado automaticamente pelo container definido em compose.yml.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/db_mentes_brilhantes}
quarkus.datasource.jdbc.new-connection-sql=SET TIME ZONE 'America/Sao_Paulo'

# Em desenvolvimento, n�o usar Dev Services para evitar trocar de container/porta e perder dados.
%dev.quarkus.datasource.devservices.enabled=false

# Em testes, manter Dev Services para isolar o banco automaticamente.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.db-name=db_mentes_brilhantes_test

# =========================
# FLYWAY (MANTENHA)
# =========================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.repair-at-start=true

# =========================
# CORS - N�O APAGUE (Essencial para o seu Frontend)
# =========================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=authorization
quarkus.http.cors.access-control-allow-credentials=true

# =========================
# JWT & SERVER
# =========================
mp.jwt.verify.issuer=${JWT_ISSUER:http://localhost:8080}
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=${JWT_ISSUER:http://localhost:8080}

quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# =========================
# UPLOADS
# =========================
# Em container, monte um volume persistente em APP_UPLOAD_ROOT_DIR
# (ex.: /data/uploads) para não armazenar arquivos na camada do container.
app.upload.root-dir=${APP_UPLOAD_ROOT_DIR:uploads}

# Habilita o console do banco no Dev UI (Aperte 'd' no terminal para ver)
%dev.quarkus.datasource.dev-ui.allow-sql=true